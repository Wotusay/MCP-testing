<!-- Angular Team Project - Main Application Layout -->
<div class="min-h-screen bg-gray-50">
  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center">
          <h1 class="text-2xl font-bold text-gray-900">{{ title() }}</h1>
          <app-status-badge class="ml-3" text="Development" variant="success">
          </app-status-badge>
        </div>
        <nav class="flex space-x-4">
          <a
            routerLink="/home"
            routerLinkActive="text-blue-600 bg-blue-50"
            class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium transition-colors"
          >
            Home
          </a>
          <a
            routerLink="/about"
            routerLinkActive="text-blue-600 bg-blue-50"
            class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium transition-colors"
          >
            About
          </a>
          <a
            routerLink="/contact"
            routerLinkActive="text-blue-600 bg-blue-50"
            class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium transition-colors"
          >
            Contact
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <!-- Router Outlet for lazy-loaded components -->
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 mt-12">
    <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
      <div class="text-center text-sm text-gray-500">
        <p>
          Angular Team Project - Built with Angular 20, Tailwind CSS, and modern
          development tools.
        </p>
        <p class="mt-1">
          Optimized with lazy loading, OnPush change detection, and performance
          monitoring.
        </p>
      </div>
    </div>
  </footer>
</div>
