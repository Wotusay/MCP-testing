<!-- Angular Team Project - Main Application Layout -->
<div
  class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200"
>
  <!-- Header -->
  <header
    class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 transition-colors duration-200"
  >
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 xl:px-12 2xl:px-16">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center">
          <h1
            class="text-2xl font-bold text-gray-900 dark:text-white transition-colors duration-200"
          >
            {{ title() }}
          </h1>
          <app-status-badge class="ml-3" text="Development" variant="success">
          </app-status-badge>
        </div>
        <div class="flex items-center space-x-2 lg:space-x-4">
          <nav class="flex space-x-2 sm:space-x-4">
            <a
              routerLink="/home"
              routerLinkActive="text-blue-600 bg-blue-50 dark:text-blue-400 dark:bg-blue-900/20"
              class="text-gray-500 hover:text-gray-700 dark:text-gray-300 dark:hover:text-gray-100 px-2 sm:px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200"
            >
              Home
            </a>
            <a
              routerLink="/about"
              routerLinkActive="text-blue-600 bg-blue-50 dark:text-blue-400 dark:bg-blue-900/20"
              class="text-gray-500 hover:text-gray-700 dark:text-gray-300 dark:hover:text-gray-100 px-2 sm:px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200"
            >
              About
            </a>
            <a
              routerLink="/contact"
              routerLinkActive="text-blue-600 bg-blue-50 dark:text-blue-400 dark:bg-blue-900/20"
              class="text-gray-500 hover:text-gray-700 dark:text-gray-300 dark:hover:text-gray-100 px-2 sm:px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200"
            >
              Contact
            </a>
          </nav>
          <!-- Theme Toggle -->
          <app-theme-toggle></app-theme-toggle>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8 xl:px-12 2xl:px-16">
    <!-- Router Outlet for lazy-loaded components -->
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer
    class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-12 transition-colors duration-200"
  >
    <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8 xl:px-12 2xl:px-16">
      <div
        class="text-center text-sm text-gray-500 dark:text-gray-400 transition-colors duration-200"
      >
        <p>
          Angular Team Project - Built with Angular 20, Tailwind CSS, and modern
          development tools.
        </p>
        <p class="mt-1">
          Optimized with lazy loading, OnPush change detection, performance
          monitoring, and theme switching.
        </p>
      </div>
    </div>
  </footer>
</div>
