name: PR Management

on:
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]

jobs:
  auto-delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    name: Auto Delete Branch
    
    steps:
    - name: Delete merged branch
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const branchName = context.payload.pull_request.head.ref;
          
          // Don't delete main or develop branches
          if (branchName === 'main' || branchName === 'develop') {
            console.log(`Skipping deletion of protected branch: ${branchName}`);
            return;
          }
          
          try {
            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${branchName}`
            });
            console.log(`Successfully deleted branch: ${branchName}`);
          } catch (error) {
            console.log(`Failed to delete branch ${branchName}: ${error.message}`);
          }

  version-management:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    name: Version Management
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Determine version bump type
      id: version-type
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const prNumber = context.payload.pull_request.number;
          
          // Get PR labels
          const { data: pr } = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: prNumber
          });
          
          const labels = pr.labels.map(label => label.name.toLowerCase());
          console.log('PR Labels:', labels);
          
          // Determine version bump based on labels
          let versionType = 'patch'; // default
          
          if (labels.includes('major') || labels.includes('breaking') || labels.includes('platform')) {
            versionType = 'major';
          } else if (labels.includes('minor') || labels.includes('feature') || labels.includes('enhancement')) {
            versionType = 'minor';
          } else if (labels.includes('patch') || labels.includes('bugfix') || labels.includes('fix')) {
            versionType = 'patch';
          }
          
          // Also check commit messages for conventional commits
          const commits = await github.rest.pulls.listCommits({
            owner,
            repo,
            pull_number: prNumber
          });
          
          for (const commit of commits.data) {
            const message = commit.commit.message.toLowerCase();
            if (message.includes('breaking change') || message.startsWith('feat!:') || message.startsWith('fix!:')) {
              versionType = 'major';
              break;
            } else if (message.startsWith('feat:')) {
              if (versionType === 'patch') versionType = 'minor';
            }
          }
          
          console.log(`Determined version type: ${versionType}`);
          core.setOutput('type', versionType);
          
    - name: Bump version
      run: |
        VERSION_TYPE="${{ steps.version-type.outputs.type }}"
        echo "Bumping version with type: $VERSION_TYPE"
        
        # Get current version
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        echo "Current version: $CURRENT_VERSION"
        
        # Bump version using npm
        npm version $VERSION_TYPE --no-git-tag-version
        
        # Get new version
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "New version: $NEW_VERSION"
        
        # Set output for later steps
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      id: bump
        
    - name: Commit version bump
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add package.json package-lock.json
        git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]" || exit 0
        git push
        
    - name: Create Git tag
      run: |
        NEW_VERSION="${{ steps.bump.outputs.new_version }}"
        git tag -a "v$NEW_VERSION" -m "Release version $NEW_VERSION"
        git push origin "v$NEW_VERSION"
        
    - name: Create GitHub Release
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const newVersion = '${{ steps.bump.outputs.new_version }}';
          const versionType = '${{ steps.version-type.outputs.type }}';
          
          let releaseBody = `## Version ${newVersion}\n\n`;
          
          switch(versionType) {
            case 'major':
              releaseBody += '🚀 **Major Release** - New platform/huge changes\n';
              break;
            case 'minor':
              releaseBody += '✨ **Minor Release** - New features\n';
              break;
            case 'patch':
              releaseBody += '🐛 **Patch Release** - Bug fixes/minor fixes\n';
              break;
          }
          
          releaseBody += `\nMerged PR: #${context.payload.pull_request.number} - ${context.payload.pull_request.title}`;
          
          await github.rest.repos.createRelease({
            owner,
            repo,
            tag_name: `v${newVersion}`,
            name: `Release v${newVersion}`,
            body: releaseBody,
            draft: false,
            prerelease: false
          });