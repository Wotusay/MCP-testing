name: PR Management

on:
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]

jobs:
  auto-delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    name: Auto Delete Branch
    
    steps:
    - name: Delete merged branch
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const branchName = context.payload.pull_request.head.ref;
          
          // Don't delete main or develop branches
          if (branchName === 'main' || branchName === 'develop') {
            console.log(`Skipping deletion of protected branch: ${branchName}`);
            return;
          }
          
          try {
            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${branchName}`
            });
            console.log(`Successfully deleted branch: ${branchName}`);
          } catch (error) {
            console.log(`Failed to delete branch ${branchName}: ${error.message}`);
          }

  version-management:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    name: Version Management
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Determine version bump type
      id: version-type
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const prNumber = context.payload.pull_request.number;
          
          // Default version type
          let versionType = 'patch';
          
          try {
            // Get PR labels
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            
            const labels = pr.labels.map(label => label.name.toLowerCase());
            console.log('PR Labels:', labels);
            
            // Determine version bump based on labels
            if (labels.includes('major') || labels.includes('breaking') || labels.includes('platform')) {
              versionType = 'major';
            } else if (labels.includes('minor') || labels.includes('feature') || labels.includes('enhancement')) {
              versionType = 'minor';
            } else if (labels.includes('patch') || labels.includes('bugfix') || labels.includes('fix')) {
              versionType = 'patch';
            }
            
            // Also check commit messages for conventional commits
            try {
              const commits = await github.rest.pulls.listCommits({
                owner,
                repo,
                pull_number: prNumber
              });
              
              for (const commit of commits.data) {
                const message = commit.commit.message.toLowerCase();
                if (message.includes('breaking change') || message.startsWith('feat!:') || message.startsWith('fix!:')) {
                  versionType = 'major';
                  break;
                } else if (message.startsWith('feat:')) {
                  if (versionType === 'patch') versionType = 'minor';
                }
              }
            } catch (commitError) {
              console.log(`::warning::Could not analyze commits: ${commitError.message}`);
            }
            
          } catch (error) {
            console.log(`::warning::Could not determine version type from PR data: ${error.message}`);
            console.log('Using default patch version bump');
          }
          
          console.log(`Determined version type: ${versionType}`);
          core.setOutput('type', versionType);
          
    - name: Bump version
      run: |
        VERSION_TYPE="${{ steps.version-type.outputs.type }}"
        echo "Bumping version with type: $VERSION_TYPE"
        
        # Validate version type and set default if invalid
        if [[ ! "$VERSION_TYPE" =~ ^(major|minor|patch)$ ]]; then
          echo "::warning::Invalid version type '$VERSION_TYPE', defaulting to 'patch'"
          VERSION_TYPE="patch"
        fi
        
        # Get current version
        CURRENT_VERSION=$(node -p "require('./package.json').version" || echo "1.0.0")
        echo "Current version: $CURRENT_VERSION"
        
        # Bump version using npm
        npm version $VERSION_TYPE --no-git-tag-version || {
          echo "::error::Failed to bump version, keeping current version"
          NEW_VERSION=$CURRENT_VERSION
        }
        
        # Get new version (or use current if bump failed)
        NEW_VERSION=$(node -p "require('./package.json').version" || echo "$CURRENT_VERSION")
        echo "New version: $NEW_VERSION"
        
        # Set output for later steps
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      id: bump
        
    - name: Commit version bump
      continue-on-error: true
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add package.json package-lock.json
        git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]" || exit 0
        git push || echo "::warning::Failed to push version bump commit - this may be due to branch protection rules"
        
    - name: Create Git tag
      continue-on-error: true
      run: |
        NEW_VERSION="${{ steps.bump.outputs.new_version }}"
        git tag -a "v$NEW_VERSION" -m "Release version $NEW_VERSION"
        git push origin "v$NEW_VERSION" || echo "::warning::Failed to push git tag - this may be due to branch protection rules or permissions"
        
    - name: Create GitHub Release
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const newVersion = '${{ steps.bump.outputs.new_version }}';
          const versionType = '${{ steps.version-type.outputs.type }}';
          
          let releaseBody = `## Version ${newVersion}\n\n`;
          
          switch(versionType) {
            case 'major':
              releaseBody += '🚀 **Major Release** - New platform/huge changes\n';
              break;
            case 'minor':
              releaseBody += '✨ **Minor Release** - New features\n';
              break;
            case 'patch':
              releaseBody += '🐛 **Patch Release** - Bug fixes/minor fixes\n';
              break;
            default:
              releaseBody += '📦 **Release** - Updates and improvements\n';
              break;
          }
          
          releaseBody += `\nMerged PR: #${context.payload.pull_request.number} - ${context.payload.pull_request.title}`;
          
          try {
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: `v${newVersion}`,
              name: `Release v${newVersion}`,
              body: releaseBody,
              draft: false,
              prerelease: false
            });
            console.log(`✅ Successfully created release v${newVersion}`);
          } catch (error) {
            console.log(`::warning::Failed to create GitHub release: ${error.message}`);
            console.log(`Release would have been: v${newVersion}`);
          }