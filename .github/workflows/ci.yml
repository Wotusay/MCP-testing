---
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Comment coverage report
        if: github.event_name == 'pull_request'
        run: |
          if [ -f coverage/angular-team-project/lcov.info ]; then
            echo "Coverage report generated successfully"
          fi

  build:
    runs-on: ubuntu-latest
    name: Build Application
    needs: [lint-and-format, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    name: Deploy Application
    needs: [lint-and-format, test, build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build:prod

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Deploy to production
        run: |
          echo "🚀 Deploying application..."
          echo "Build completed at: $(date)"
          echo "Deployment would happen here automatically"
          echo "✅ Deployment completed successfully"

      - name: Run post-deployment health checks
        run: |
          echo "🔍 Running health checks..."
          echo "✅ Application is healthy and running"

      - name: Notify deployment success
        run: |
          echo "📢 Deployment notification sent"
          echo "🎉 Deployment completed automatically without manual approval!"

  workflow-summary:
    runs-on: ubuntu-latest
    name: Workflow Summary
    needs: [lint-and-format, test, build, security-scan, deploy]
    if: always()

    steps:
      - name: Workflow completion summary
        run: |
          echo "🎯 CI/CD Pipeline Execution Summary"
          echo "=================================="
          echo "✅ Lint and Format: ${{ needs.lint-and-format.result }}"
          echo "✅ Tests: ${{ needs.test.result }}"
          echo "✅ Build: ${{ needs.build.result }}"
          echo "✅ Security Scan: ${{ needs.security-scan.result }}"
          echo "✅ Deploy: ${{ needs.deploy.result }}"
          echo ""
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "🚀 AUTOMATIC DEPLOYMENT COMPLETED SUCCESSFULLY!"
            echo "No manual approval was required - fully automated workflow!"
          elif [[ "${{ needs.deploy.result }}" == "skipped" ]]; then
            echo "ℹ️  Deployment skipped (not main branch push)"
          else
            echo "❌ Deployment failed - check logs above"
          fi
